name: Build IPA

# Builds an unsigned .ipa on a macOS runner. Unsigned is deliberate: AltStore
# re-signs with your own Apple ID when it installs, so no certificates or
# secrets are needed here.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier to build with
        default: com.omonzon.homehub
      homekit:
        description: Compile in HomeKit support (needs a paid account to install)
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          FLAGS=""
          if [ "${{ inputs.homekit }}" = "true" ]; then FLAGS="--homekit"; fi
          python3 Scripts/generate_project.py \
            --bundle-id "${{ inputs.bundle_id || 'com.omonzon.homehub' }}" \
            $FLAGS

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project HomeHub.xcodeproj \
            -scheme HomeHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Error summary
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -E "^/.*(error|warning): " xcodebuild.log | sort -u | head -200 || true
          echo "::endgroup::"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HomeHub.ipa Payload
          ls -lh HomeHub.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-ipa
          path: HomeHub.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" HomeHub.ipa --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" HomeHub.ipa --clobber
