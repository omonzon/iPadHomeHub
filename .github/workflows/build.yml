name: Build IPA

# Builds the app on a macOS runner, in one of two shapes:
#
# - Unsigned (default). AltStore or SideStore re-signs it with the installer's
#   own Apple ID, so no certificates or secrets are needed here.
# - Ad hoc signed, when the three secrets below exist. Installs on the devices
#   named in the profile by dragging the .ipa onto the iPad in Finder -- no
#   AltStore, no 7-day refresh, no Developer Mode -- and stays valid until the
#   profile or certificate expires (a year).
#
# Secrets (Settings > Secrets and variables > Actions):
#   SIGNING_CERT_P12       base64 of an Apple Distribution certificate + key (.p12)
#   SIGNING_CERT_PASSWORD  the password the .p12 was exported with
#   ADHOC_PROFILE          base64 of an Ad Hoc .mobileprovision
# The team ID and bundle ID are read from the profile, so they cannot drift
# out of step with it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier for unsigned builds (signed builds use the profile's)
        default: com.omonzon.homehub
      homekit:
        description: Compile in HomeKit support (needs a paid account to install)
        type: boolean
        default: false
      release_tag:
        description: Publish a release at this tag (e.g. v1.0). Blank = just build.
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # Releases are public, so they always carry the unsigned build: a signed .ipa
  # embeds its profile, which lists the registered devices and the team.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Signing setup
        id: signing
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE: ${{ secrets.ADHOC_PROFILE }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE" ]; then
            echo "No signing secrets -- building unsigned."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            echo "Release run -- building unsigned for the public release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A throwaway keychain holds the certificate for this job only.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }

          UUID=$(pb UUID)
          NAME=$(pb Name)
          TEAM=$(pb TeamIdentifier:0)
          APP_ID=$(pb Entitlements:application-identifier)
          BUNDLE="${APP_ID#"$TEAM".}"
          # A wildcard App ID signs any bundle under its prefix.
          case "$BUNDLE" in
            '*')  BUNDLE="com.omonzon.homehub" ;;
            *'*') BUNDLE="${BUNDLE%'*'}homehub" ;;
          esac
          HOMEKIT=$(pb Entitlements:com.apple.developer.homekit || true)

          # Xcode 16 reads profiles from UserData; older Xcodes from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$UUID.mobileprovision"
          done

          echo "Signing: team $TEAM, bundle $BUNDLE, profile \"$NAME\", expires $(pb ExpirationDate)"
          {
            echo "enabled=true"
            echo "team=$TEAM"
            echo "bundle=$BUNDLE"
            echo "profile=$NAME"
            echo "keychain=$KEYCHAIN"
            echo "homekit=$HOMEKIT"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          ARGS=()
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            ARGS+=(--bundle-id "${{ steps.signing.outputs.bundle }}" --team "${{ steps.signing.outputs.team }}")
          else
            ARGS+=(--bundle-id "${{ inputs.bundle_id || 'com.omonzon.homehub' }}")
          fi
          # A profile that carries the HomeKit entitlement turns HomeKit on.
          if [ "${{ inputs.homekit }}" = "true" ] || [ "${{ steps.signing.outputs.homekit }}" = "true" ]; then
            ARGS+=(--homekit)
          fi
          python3 Scripts/generate_project.py "${ARGS[@]}"

      - name: Build (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          xcodebuild \
            -project HomeHub.xcodeproj \
            -scheme HomeHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Build and export (ad hoc)
        if: steps.signing.outputs.enabled == 'true'
        env:
          TEAM: ${{ steps.signing.outputs.team }}
          BUNDLE: ${{ steps.signing.outputs.bundle }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          xcodebuild \
            -project HomeHub.xcodeproj \
            -scheme HomeHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/HomeHub.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive 2>&1 | tee xcodebuild.log

          # "release-testing" is Xcode 15.3+'s name for the ad hoc method.
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/HomeHub.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export 2>&1 | tee -a xcodebuild.log

      # Runs on success too: a green build with deprecation warnings still
      # tells you something, and reading it here beats downloading the log.
      # awk (not grep) because awk exits 0 when nothing matches -- under
      # `bash -eo pipefail` a no-match grep would fail the whole job, and a
      # reporting step must never be able to do that. continue-on-error is
      # the second line of defence for the same reason.
      - name: Diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          touch xcodebuild.log
          awk '/^\/.*error: |^error: /' xcodebuild.log | sort -u > errors.txt
          awk '/^\/.*warning: /'        xcodebuild.log | sort -u > warnings.txt
          echo "errors: $(wc -l < errors.txt | tr -d ' ')   unique warnings: $(wc -l < warnings.txt | tr -d ' ')"
          for f in errors warnings; do
            if [ -s "$f.txt" ]; then
              echo "::group::${f}"
              sed 's|.*/iPadHomeHub/||' "$f.txt" | head -100
              echo "::endgroup::"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Package .ipa
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
            if [ -z "$IPA" ]; then echo "Export produced no .ipa"; exit 1; fi
            cp "$IPA" HomeHub.ipa
          else
            APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry HomeHub.ipa Payload
          fi
          ls -lh HomeHub.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.enabled == 'true' && 'HomeHub-adhoc-ipa' || 'HomeHub-ipa' }}
          path: HomeHub.ipa
          if-no-files-found: error

      # Fires on a v* tag push, or on a manual run given a release_tag.
      # `gh release create` creates the tag at --target when it doesn't exist,
      # so a release can be cut without pushing a tag first.
      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          echo "publishing $TAG at $GITHUB_SHA"
          gh release create "$TAG" HomeHub.ipa \
              --target "$GITHUB_SHA" \
              --title "Home Hub $TAG" \
              --notes-file .github/release-notes.md \
            || gh release upload "$TAG" HomeHub.ipa --clobber

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
