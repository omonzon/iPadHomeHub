name: Build IPA

# Builds an unsigned .ipa on a macOS runner. Unsigned is deliberate: AltStore
# re-signs with your own Apple ID when it installs, so no certificates or
# secrets are needed here.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier to build with
        default: com.omonzon.homehub
      homekit:
        description: Compile in HomeKit support (needs a paid account to install)
        type: boolean
        default: false
      release_tag:
        description: Publish a release at this tag (e.g. v1.0). Blank = just build.
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: |
          FLAGS=""
          if [ "${{ inputs.homekit }}" = "true" ]; then FLAGS="--homekit"; fi
          python3 Scripts/generate_project.py \
            --bundle-id "${{ inputs.bundle_id || 'com.omonzon.homehub' }}" \
            $FLAGS

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project HomeHub.xcodeproj \
            -scheme HomeHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      # Runs on success too: a green build with deprecation warnings still
      # tells you something, and reading it here beats downloading the log.
      # awk (not grep) because awk exits 0 when nothing matches -- under
      # `bash -eo pipefail` a no-match grep would fail the whole job, and a
      # reporting step must never be able to do that. continue-on-error is
      # the second line of defence for the same reason.
      - name: Diagnostics summary
        if: always()
        continue-on-error: true
        run: |
          awk '/^\/.*error: /'   xcodebuild.log | sort -u > errors.txt
          awk '/^\/.*warning: /' xcodebuild.log | sort -u > warnings.txt
          echo "errors: $(wc -l < errors.txt | tr -d ' ')   unique warnings: $(wc -l < warnings.txt | tr -d ' ')"
          for f in errors warnings; do
            if [ -s "$f.txt" ]; then
              echo "::group::${f}"
              sed 's|.*/iPadHomeHub/||' "$f.txt" | head -100
              echo "::endgroup::"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HomeHub.ipa Payload
          ls -lh HomeHub.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HomeHub-ipa
          path: HomeHub.ipa
          if-no-files-found: error

      # Fires on a v* tag push, or on a manual run given a release_tag.
      # `gh release create` creates the tag at --target when it doesn't exist,
      # so a release can be cut without pushing a tag first.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          echo "publishing $TAG at $GITHUB_SHA"
          gh release create "$TAG" HomeHub.ipa \
              --target "$GITHUB_SHA" \
              --title "Home Hub $TAG" \
              --notes-file .github/release-notes.md \
            || gh release upload "$TAG" HomeHub.ipa --clobber
